<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Small Business Map</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #1a1a2e;
        --paper: #f5f0e8;
        --accent: #c8442a;
        --accent2: #2a6496;
        --muted: #8a8070;
        --border: #d4c9b0;
        --panel: #ede8dc;
      }
      body {
        font-family: "DM Mono", monospace;
        background: var(--ink);
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        background: var(--ink);
        color: var(--paper);
        padding: 12px 24px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-shrink: 0;
        border-bottom: 2px solid var(--accent);
      }
      header h1 {
        font-family: "Fraunces", serif;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--paper);
      }
      header span {
        font-size: 0.7rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .count-badge {
        margin-left: auto;
        background: var(--accent);
        color: var(--paper);
        font-size: 0.7rem;
        padding: 3px 10px;
        letter-spacing: 0.1em;
      }
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .sidebar {
        width: 340px;
        flex-shrink: 0;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      .add-panel {
        padding: 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .add-panel h2 {
        font-family: "Fraunces", serif;
        font-size: 0.95rem;
        font-weight: 300;
        font-style: italic;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .field input,
      .field textarea {
        width: 100%;
        background: var(--paper);
        border: 1px solid var(--border);
        padding: 7px 10px;
        font-family: "DM Mono", monospace;
        font-size: 0.78rem;
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s;
        resize: none;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--accent2);
      }
      .field textarea {
        height: 60px;
      }
      .add-btn {
        width: 100%;
        padding: 10px;
        background: var(--accent);
        color: var(--paper);
        border: none;
        font-family: "DM Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
        margin-top: 4px;
      }
      .add-btn:hover {
        background: #a8381f;
      }
      .add-btn:active {
        transform: scale(0.98);
      }
      .add-btn:disabled {
        background: var(--muted);
        cursor: not-allowed;
      }
      .error-msg {
        font-size: 0.7rem;
        color: var(--accent);
        margin-top: 6px;
        min-height: 16px;
      }
      .businesses-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }
      .businesses-list h2 {
        font-family: "Fraunces", serif;
        font-size: 0.85rem;
        font-weight: 300;
        font-style: italic;
        color: var(--muted);
        padding: 4px 6px 10px;
      }
      .business-card {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        position: relative;
      }
      .business-card:hover {
        border-color: var(--accent2);
        box-shadow: 2px 2px 0 var(--accent2);
      }
      .business-card.active {
        border-color: var(--accent);
        box-shadow: 2px 2px 0 var(--accent);
      }
      .business-card .card-title {
        font-family: "Fraunces", serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .business-card .card-addr {
        font-size: 0.68rem;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .business-card .card-info {
        font-size: 0.73rem;
        color: var(--ink);
        opacity: 0.8;
        line-height: 1.4;
      }
      .business-card .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 2px 5px;
        transition: color 0.15s;
      }
      .business-card .delete-btn:hover {
        color: var(--accent);
      }
      #map {
        flex: 1;
        z-index: 0;
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(26, 26, 46, 0.6);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        font-family: "DM Mono", monospace;
        color: var(--paper);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
      }
      .overlay.show {
        display: flex;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(245, 240, 232, 0.3);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .custom-popup .leaflet-popup-content-wrapper {
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: 4px 4px 0 rgba(26, 26, 46, 0.3);
        font-family: "DM Mono", monospace;
      }
      .custom-popup .leaflet-popup-tip {
        background: var(--paper);
      }
      .popup-title {
        font-family: "Fraunces", serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .popup-addr {
        font-size: 0.68rem;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .popup-info {
        font-size: 0.75rem;
        color: var(--ink);
        line-height: 1.5;
      }
      .empty-state {
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        padding: 30px 20px;
        line-height: 1.8;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--panel);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Small Business Map</h1>
      <span>Shared Map</span>
      <div class="count-badge" id="countBadge">loading…</div>
    </header>
    <div class="layout">
      <div class="sidebar">
        <div class="add-panel">
          <h2>Add a new business</h2>
          <div class="field">
            <label>Title</label
            ><input
              type="text"
              id="inputTitle"
              placeholder="e.g. Ben's Cool Small Business"
            />
          </div>
          <div class="field">
            <label>Address</label
            ><input
              type="text"
              id="inputAddress"
              placeholder="e.g. 123 Main St, New York"
            />
          </div>
          <div class="field">
            <label>Info</label
            ><textarea
              id="inputInfo"
              placeholder="Any notes or description..."
            ></textarea>
          </div>
          <button class="add-btn" id="addBtn" onclick="addBusiness()">
            + Add Business
          </button>
          <div class="error-msg" id="errorMsg"></div>
        </div>
        <div class="businesses-list">
          <h2>Businesses</h2>
          <div id="cardList">
            <div class="empty-state">Loading businesses…</div>
          </div>
        </div>
      </div>
      <div id="map"></div>
    </div>
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span id="loadingMsg">Looking up address…</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
      const SUPABASE_URL = "https://vmxmhyhpxmhiwuzpmkzv.supabase.co";
      const SUPABASE_KEY = "sb_publishable__UrTW702y4PCYZxIy1hfFA_6Lgbnn3h";
      const HEADERS = {
        "Content-Type": "application/json",
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
      };

      async function dbGetAll() {
        const res = await fetch(
          SUPABASE_URL + "/rest/v1/points?select=*&order=created_at.asc",
          { headers: HEADERS },
        );
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }
      async function dbInsert(business) {
        const res = await fetch(SUPABASE_URL + "/rest/v1/points", {
          method: "POST",
          headers: { ...HEADERS, Prefer: "return=representation" },
          body: JSON.stringify(business),
        });
        if (!res.ok) throw new Error(await res.text());
        return (await res.json())[0];
      }
      async function dbDelete(id) {
        const res = await fetch(SUPABASE_URL + "/rest/v1/points?id=eq." + id, {
          method: "DELETE",
          headers: HEADERS,
        });
        if (!res.ok) throw new Error(await res.text());
      }

      const map = L.map("map").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(map);

      const makeIcon = (active) =>
        L.divIcon({
          className: "",
          html:
            '<div style="width:18px;height:18px;background:' +
            (active ? "#c8442a" : "#2a6496") +
            ";border:2px solid " +
            (active ? "#a8381f" : "#1a4a70") +
            ';border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:2px 2px 4px rgba(0,0,0,0.3);"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 18],
          popupAnchor: [0, -20],
        });

      const businesses = [];
      let activeId = null;

      async function loadBusinesses() {
        try {
          const rows = await dbGetAll();
          rows.forEach((row) => addMarker(row));
          renderCards();
          if (rows.length > 0)
            map.fitBounds(L.latLngBounds(rows.map((r) => [r.lat, r.lng])), {
              padding: [40, 40],
            });
        } catch (e) {
          document.getElementById("cardList").innerHTML =
            '<div class="empty-state">Could not load businesses.<br>' +
            e.message +
            "</div>";
          document.getElementById("countBadge").textContent = "error";
        }
      }

      function addMarker(row) {
        const marker = L.marker([row.lat, row.lng], { icon: makeIcon(false) })
          .addTo(map)
          .bindPopup(
            '<div class="popup-title">' +
              esc(row.title) +
              '</div><div class="popup-addr">' +
              esc(row.address) +
              "</div>" +
              (row.info
                ? '<div class="popup-info">' + esc(row.info) + "</div>"
                : ""),
            { className: "custom-popup", maxWidth: 240 },
          );
        marker.on("click", () => setActive(row.id));
        businesses.push({ ...row, marker });
      }

      async function geocode(address) {
        const res = await fetch(
          "https://nominatim.openstreetmap.org/search?format=json&q=" +
            encodeURIComponent(address) +
            "&limit=1",
          { headers: { "Accept-Language": "en" } },
        );
        const data = await res.json();
        if (!data.length) return null;
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }

      async function addBusiness() {
        const title = document.getElementById("inputTitle").value.trim();
        const address = document.getElementById("inputAddress").value.trim();
        const info = document.getElementById("inputInfo").value.trim();
        const errEl = document.getElementById("errorMsg");
        const btn = document.getElementById("addBtn");
        if (!title) {
          errEl.textContent = "Please enter a title.";
          return;
        }
        if (!address) {
          errEl.textContent = "Please enter an address.";
          return;
        }
        errEl.textContent = "";
        btn.disabled = true;
        showOverlay("Looking up address…");
        const geo = await geocode(address);
        if (!geo) {
          hideOverlay();
          btn.disabled = false;
          errEl.textContent = "Address not found. Try something more specific.";
          return;
        }
        showOverlay("Saving to database…");
        try {
          const row = await dbInsert({
            title,
            address,
            info: info || null,
            lat: geo.lat,
            lng: geo.lng,
          });
          addMarker(row);
          renderCards();
          setActive(row.id);
          map.flyTo([geo.lat, geo.lng], 14, { animate: true });
          document.getElementById("inputTitle").value = "";
          document.getElementById("inputAddress").value = "";
          document.getElementById("inputInfo").value = "";
        } catch (e) {
          errEl.textContent = "Save failed: " + e.message;
        }
        hideOverlay();
        btn.disabled = false;
      }

      async function deleteBusiness(id, e) {
        e.stopPropagation();
        try {
          await dbDelete(id);
          const idx = businesses.findIndex((b) => b.id === id);
          if (idx !== -1) {
            map.removeLayer(businesses[idx].marker);
            businesses.splice(idx, 1);
          }
          if (activeId === id) activeId = null;
          renderCards();
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      }

      function setActive(id) {
        if (activeId !== null) {
          const old = businesses.find((b) => b.id === activeId);
          if (old) old.marker.setIcon(makeIcon(false));
        }
        activeId = id;
        const biz = businesses.find((b) => b.id === id);
        if (!biz) return;
        biz.marker.setIcon(makeIcon(true));
        biz.marker.openPopup();
        renderCards();
        const card = document.getElementById("card-" + id);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function flyTo(id) {
        const biz = businesses.find((b) => b.id === id);
        if (!biz) return;
        map.flyTo([biz.lat, biz.lng], 15, { duration: 1 });
        setActive(id);
      }

      function renderCards() {
        const list = document.getElementById("cardList");
        document.getElementById("countBadge").textContent =
          businesses.length +
          " business" +
          (businesses.length !== 1 ? "es" : "");
        if (!businesses.length) {
          list.innerHTML =
            '<div class="empty-state">No businesses yet.<br>Add one above to get started.</div>';
          return;
        }
        list.innerHTML = businesses
          .map(
            (b) =>
              '<div class="business-card ' +
              (b.id === activeId ? "active" : "") +
              '" id="card-' +
              b.id +
              '" onclick="flyTo(' +
              b.id +
              ')">' +
              '<button class="delete-btn" onclick="deleteBusiness(' +
              b.id +
              ', event)" title="Remove">✕</button>' +
              '<div class="card-title">' +
              esc(b.title) +
              "</div>" +
              '<div class="card-addr">' +
              esc(b.address) +
              "</div>" +
              (b.info
                ? '<div class="card-info">' + esc(b.info) + "</div>"
                : "") +
              "</div>",
          )
          .join("");
      }

      function esc(s) {
        return (s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function showOverlay(msg) {
        document.getElementById("loadingMsg").textContent = msg;
        document.getElementById("loadingOverlay").classList.add("show");
      }
      function hideOverlay() {
        document.getElementById("loadingOverlay").classList.remove("show");
      }

      document.getElementById("inputTitle").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("inputAddress").focus();
      });
      document
        .getElementById("inputAddress")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") addBusiness();
        });

      loadBusinesses();
    </script>
  </body>
</html>
